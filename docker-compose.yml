version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: smart_city_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smart_city_net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_city_backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:2717/smartcity
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_smart_city_governance_jwt_token_key_2026
      - JWT_EXPIRES_IN=7d
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - smart_city_net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_city_frontend
    ports:
      - "3000:3000"
    networks:
      - smart_city_net
    restart: always

  mongodb:
    image: mongo:latest
    container_name: smart_city_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - smart_city_net
    restart: always

  redis:
    image: redis:alpine
    container_name: smart_city_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart_city_net
    restart: always

networks:
  smart_city_net:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
